services:
  - type: web
    name: satsprint-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: satsprint-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://satsprint.onrender.com

databases:
  - name: satsprint-db
    databaseName: satsprint
    plan: basic-256mb
    region: oregon
    diskSizeGB: 1
